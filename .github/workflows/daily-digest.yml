name: Daily Digest

on:
  schedule:
    # Ziel: ~04:00 Berlin (Sommer) bzw. ~03:00 (Winter) — die 1h DST-Drift nehmen
    # wir bewusst in Kauf, statt auf eine exakte Stunde zu pruefen: geplante Laeufe
    # werden oft verspaetet gestartet, ein Stunden-Gate wuerde sie dann verwerfen.
    # Die krummen Minuten meiden den Stau zur vollen Stunde.
    # GitHub drops scheduled runs entirely when Actions is under load — no run,
    # no queue entry, no trace. That is what silently skipped a morning digest.
    # So we try three times; the job itself checks email_logs and exits early if
    # today's digest already went out, which makes the extra attempts harmless.
    - cron: '13 2 * * *' # 02:13 UTC — ~04:13 Berlin (summer)
    - cron: '43 3 * * *' # 03:43 UTC — Auffangnetz, falls der erste Lauf ausfaellt
    - cron: '27 5 * * *' # 05:27 UTC — letzter Versuch vor dem Aufstehen
  # Lets you trigger a run manually from the Actions tab to test.
  workflow_dispatch:
    inputs:
      force:
        description: 'Auch senden, wenn heute schon eine Mail rausging'
        type: boolean
        default: false

# Avoid overlapping runs if a previous one is still going.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run daily digest (aggregate -> summarize -> email)
        run: npm run task -- digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # flash-lite has more free-tier headroom; flash-latest has been
          # returning 503/timeouts. GeminiClient falls through the rest on failure.
          GEMINI_MODEL: gemini-flash-lite-latest
          GEMINI_FALLBACK_MODELS: gemini-flash-latest,gemini-3.1-flash-lite
          # Optional non-Google backup (Groq/OpenRouter/...). Inert unless set, so a
          # Google outage or billing block can no longer empty the whole digest.
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_MODEL: ${{ vars.OPENAI_COMPAT_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_TIMEZONE: Europe/Berlin
          # Nur beim manuellen Lauf relevant: erzwingt den Versand trotz Guard.
          FORCE_EMAIL: ${{ github.event.inputs.force }}
          # Reddit (optional): the client self-skips if these are unset, so the
          # workflow is safe before the secrets exist. Add them to turn Reddit on.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          # Set the DRY_RUN_EMAIL repository *variable* to "true" to preview
          # without sending; anything else (or unset) sends real email.
          DRY_RUN_EMAIL: ${{ vars.DRY_RUN_EMAIL }}

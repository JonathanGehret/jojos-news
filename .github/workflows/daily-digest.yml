name: Daily Digest

on:
  schedule:
    # Target: 04:00 Berlin year-round. GitHub cron is UTC with no DST, so we run
    # two candidate times and the runner's RUN_ONLY_AT_BERLIN_HOUR guard lets
    # only the one that equals 04:00 Berlin proceed; the other exits immediately.
    - cron: '0 2 * * *' # 02:00 UTC = 04:00 Berlin during CEST (summer)
    - cron: '0 3 * * *' # 03:00 UTC = 04:00 Berlin during CET (winter)
  # Lets you trigger a run manually from the Actions tab to test (no time gate).
  workflow_dispatch: {}

# Avoid overlapping runs if a previous one is still going.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run daily digest (aggregate -> summarize -> email)
        run: npm run task -- digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-latest
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_TIMEZONE: Europe/Berlin
          # Set the DRY_RUN_EMAIL repository *variable* to "true" to preview
          # without sending; anything else (or unset) sends real email.
          DRY_RUN_EMAIL: ${{ vars.DRY_RUN_EMAIL }}
          # Enforce 04:00 Berlin only on scheduled runs; manual runs are ungated.
          RUN_ONLY_AT_BERLIN_HOUR: ${{ github.event_name == 'schedule' && '4' || '' }}
